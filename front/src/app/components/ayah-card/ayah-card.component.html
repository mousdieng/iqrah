<div
  class="ayah-card p-4 rounded-lg border-2 transition-all duration-300 hover:shadow-lg"
  [style.border-color]="isSelected ? 'var(--color-accent)' : 'var(--color-card-border)'"
  [style.background-color]="isMemorized ? 'var(--color-accent-alpha)' : 'var(--color-surface)'">

  <!-- Ayah Info Header -->
  @if (showSurahInfo) {
    <div class="flex items-center justify-between mb-3 pb-2 border-b" style="border-color: var(--color-card-border);">
      <div class="flex items-center space-x-3">
        <div class="text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold"
          style="background-color: var(--color-primary);">
          {{ ayah.numberInSurah }}
        </div>
        <div class="text-xs" style="color: var(--color-text-secondary);">
          <span>Page {{ ayah.page }}</span>
          <span class="mx-2">•</span>
          <span>Juz {{ ayah.juz }}</span>
        </div>
      </div>

      <!-- Status Icons -->
      <div class="flex items-center space-x-2">
        @if (isMemorized) {
          <i class="pi pi-check-circle" style="color: var(--color-success);" pTooltip="Mémorisé"></i>
        }
        @if (isFavorite) {
          <i class="pi pi-heart-fill" style="color: var(--color-error);" pTooltip="Favori"></i>
        }
        @if (ayah.sajda) {
          <i class="pi pi-star" style="color: var(--color-accent);" pTooltip="Sajda"></i>
        }
      </div>
    </div>
  }

  <!-- Ayah Text -->
  <div class="quran-text mb-4 text-right" dir="rtl">
    {{ ayah.text }}
  </div>

  <!-- Actions -->
  <div class="flex items-center justify-between pt-3 border-t" style="border-color: var(--color-card-border);">
    <div class="flex items-center space-x-2">
      <!-- Play Button -->
      <button
        pButton
        icon="pi pi-play"
        class="p-button-rounded p-button-text p-button-sm"
        pTooltip="Écouter"
        tooltipPosition="top"
        (click)="onPlayClick()">
      </button>

      <!-- Repeat Button -->
      <button
        pButton
        icon="pi pi-sync"
        class="p-button-rounded p-button-text p-button-sm"
        pTooltip="Répéter"
        tooltipPosition="top"
        (click)="onRepeatClick()">
      </button>

      <!-- Favorite Button -->
      <button
        pButton
        [icon]="isFavorite ? 'pi pi-heart-fill' : 'pi pi-heart'"
        class="p-button-rounded p-button-text p-button-sm"
        [class.p-button-danger]="isFavorite"
        pTooltip="Favori"
        tooltipPosition="top"
        (click)="onFavoriteClick()">
      </button>

      <!-- Memorized Button -->
      <button
        pButton
        [icon]="isMemorized ? 'pi pi-check-circle' : 'pi pi-circle'"
        class="p-button-rounded p-button-text p-button-sm"
        [class.p-button-success]="isMemorized"
        pTooltip="Marquer comme mémorisé"
        tooltipPosition="top"
        (click)="onMemorizedClick()">
      </button>
    </div>

    <!-- Ayah Number Badge -->
    <div class="text-xs font-mono px-2 py-1 rounded"
      style="color: var(--color-text-muted); background-color: var(--color-surface-hover);">
      #{{ ayah.id }}
    </div>
  </div>
</div>
