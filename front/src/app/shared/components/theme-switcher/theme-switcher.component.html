<button type="button" class="icon-button"
        [attr.aria-label]="'Thème : ' + currentName()"
        [attr.aria-expanded]="open()"
        aria-haspopup="menu"
        [title]="'Thème : ' + currentName()"
        (click)="toggle()">
  <i [class]="currentIcon()"></i>
</button>

@if (open()) {
  <div class="theme-menu" role="menu" aria-label="Choisir un thème">
    @for (theme of themes; track theme.id) {
      <button type="button" role="menuitemradio"
              class="theme-option"
              [class.active]="theme.id === currentId()"
              [attr.aria-checked]="theme.id === currentId()"
              (click)="choose(theme.id)">
        <i [class]="theme.icon"></i>
        <span>{{ theme.name }}</span>
        @if (theme.id === currentId()) {
          <i class="pi pi-check check"></i>
        }
      </button>
    }
  </div>
}
